name: build kernel - OPPO Reno6 Pro

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:

      - name: Setup environment
        uses: daaku/gh-action-apt-install@v4
        with:
          packages: ccache libncurses5-dev libncurses-dev libssl-dev device-tree-compiler bc cpio lib32ncurses5-dev lib32z1 build-essential binutils bison curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libsdl1.2-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev aria2


      - name: Pull toolchain
        run: |
          cd $HOME

          git clone --depth=1 \
          https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
          aarch64-linux-android-4.9

          git clone --depth=1 \
          https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
          arm-linux-androideabi-4.9


      - name: Pull clang
        run: |
          cd $HOME
          git clone --depth=1 https://github.com/dpkg123/clang clang


      - name: Pull kernel source
        run: |
          cd $HOME

          git clone --depth=1 \
          -b 4.19_reno6pro \
          https://github.com/dabao1955/android_kernel_OPPO_PEQM00.git \
          kernel-4.19


      - name: Pull vendor source
        run: |

          cd $HOME

          git clone --depth=1 \
          https://github.com/oppo-source/android_kernel_modules_oppo_mtk_4.19 \
          vendor-source

          cp vendor-source/vendor ./ -R

          cp -r \
          vendor/oplus/kernel_4.19/audio \
          kernel-4.19/sound/soc/codecs/


      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          max-size: 4G


      - name: Build kernel
        run: |

          cd $HOME/kernel-4.19

          bash build_kernel.sh


      - name: Upload kernel
        uses: actions/upload-artifact@v3
        with:
          name: kernel-6893-4.19
          path: |
            kernel-4.19/out/arch/arm64/boot/*
